    <title>{% block title %}Stoquex{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'equipamentos/css/style.css' %}">
</head>
<body>

        <a href="{% url 'lista_equipamentos' %}" class="logo">Stoquex</a>
